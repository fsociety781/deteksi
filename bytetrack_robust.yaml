# Robust ByteTrack Configuration for High-Speed Traffic & Toll Road Monitoring
# Optimized for fast-moving vehicles, large frame displacements, and occlusion resistance

tracker_type: bytetrack
track_high_thresh: 0.20      # Threshold for first-stage matching (captures fast vehicles with motion blur)
track_low_thresh: 0.05       # Second-stage threshold for distant / partially visible vehicles
new_track_thresh: 0.20       # Quickly initialize track as soon as vehicle enters frame
track_buffer: 60             # Keep lost tracks alive for up to 60 frames (~2s) to bridge occlusions
match_thresh: 0.85           # Association cost threshold (1 - IoU); supports fast highway displacements
fuse_score: True             # Fuse detection confidence with motion similarity
